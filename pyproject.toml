[project]
name = "eucare"
version = "0.1.0"
description = "Geometric tilings, Conway operators, and origami crease patterns"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "networkx",
    "numba",
    "tqdm",
    "pycairo",
    "svgwrite",
    "svgpathtools",
    "fastcluster",
    "scikit-learn",
    "sympy",
    "pyyaml",
    "pulp",
]

[project.optional-dependencies]
notebook = ["jupyter", "ipywidgets", "ipympl", "widgetsnbextension"]
threed = ["meshio"]
torch = ["torch", "einops"]
image = ["scikit-image", "mahotas"]
intersecting_cylinders = ["rdp", "plotly"]
dev = ["pytest", "pytest-cov", "black", "mypy", "pre-commit", "rdp", "plotly"]
docs = ["mkdocs-material", "mkdocstrings[python]", "mkdocs-gen-files", "mkdocs-literate-nav", "mkdocs-jupyter", "scikit-image", "mahotas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eucare"]

[tool.hatch.build]
include = ["eucare/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["eucare"]
omit = ["eucare/image_to_graph.py", "eucare/marching_cubes.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]

[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = '''
/(\
    notebooks
  | site
  | htmlcov
  | docs/notebooks
)/
'''

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
# Start permissive; tighten per module via overrides as typing lands.
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Modules that have been fully annotated — promote to strict here.
module = []
disallow_untyped_defs = true
