name: CI

on:
  push:
    branches: [main, master, cleanup]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install system dependencies (cairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install project
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --no-sync pytest -q -m "not slow"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run black
        run: uvx black@24.10.0 --check pleat tests

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install system dependencies (cairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install project with docs extras
        run: uv sync --extra dev --extra docs

      - name: Build docs
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: uv run --no-sync mkdocs build --strict
