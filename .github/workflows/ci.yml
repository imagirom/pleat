name: CI

on:
  push:
    branches: [main, master, cleanup]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install system dependencies (cairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install project
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        run: pytest -q -m "not slow"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.10

      - name: Install ruff
        run: uv pip install --system ruff

      - name: Run ruff
        run: ruff check eucare tests

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.10

      - name: Install system dependencies (cairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install project with docs extras
        run: uv pip install --system -e ".[dev,docs]"

      - name: Build docs
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict
