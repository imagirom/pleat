site_name: Pleat
site_description: Geometric tilings, Conway operators, and origami crease patterns
site_url: https://imagirom.github.io/pleat/
repo_url: https://github.com/imagirom/pleat

# Render each page as `path/name.html` rather than `path/name/index.html`.
# This keeps the built-doc relative paths aligned with the source layout (in
# particular, image refs like `images/<sub>/foo.png` inside notebooks resolve
# in both Jupyter and the built site without duplicating image trees).
use_directory_urls: false

theme:
  name: materialx
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.follow

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: true
      allow_errors: false
      include_requirejs: true
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source

hooks:
  - docs/hooks.py

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.ipynb
  - Installation: getting-started/installation.md
  - Notebooks:
      - Constructing tilings:
          - Euclidean Tilings: notebooks/Tilings_Euclidean.ipynb
          - Curved Geometries: notebooks/Curved_Geometries.ipynb
          - Conway Operators: notebooks/Conway_Operators.ipynb
          - Styling: notebooks/Styling.ipynb
          - Modifications: notebooks/Modifications.ipynb
          - Circle Packing: notebooks/Circle_Packing.ipynb
          - Image to graph: notebooks/Image_To_Graph.ipynb
          - Saving and exporting: notebooks/Saving_and_Exporting.ipynb
          - GomJau-Hogg Notation: notebooks/GomJau_Hogg_Notation.ipynb
      - Tilings to origami tessellations:
          - Shrink-Rotate: notebooks/Shrink_Rotate_Tessellations.ipynb
          - Intersecting Cylinders: notebooks/Intersecting_Cylinders.ipynb
          - Alternating Flagstones: notebooks/Alternating_Flagstones.ipynb
      - Manipulating crease patterns:
          - Ray Casting and Sink Folds: notebooks/Ray_Casting_and_Sinks.ipynb
      # - 04 Folding and Overlap: notebooks/Folding_and_Overlap.ipynb #TODO: proper notebook walking through my layer-order algorithm: CP -> Overlap graph -> ILP -> layer-order -> top / bottom rendering

  - Architecture: concepts/architecture.md
  - Contributing:
      - Docs Pipeline: contributing/docs-pipeline.md
  - API Reference: reference/
