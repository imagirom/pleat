site_name: Eucare
site_description: Geometric tilings, Conway operators, and origami crease patterns
repo_url: https://github.com/rremme/eucare

# Render each page as `path/name.html` rather than `path/name/index.html`.
# This keeps the built-doc relative paths aligned with the source layout (in
# particular, image refs like `images/<sub>/foo.png` inside notebooks resolve
# in both Jupyter and the built site without duplicating image trees).
use_directory_urls: false

theme:
  name: materialx
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.follow

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: true
      include_requirejs: true
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: getting-started/installation.md
  - Notebooks:
      - Overview: notebooks/00_Overview.ipynb
      - Constructing tilings:
          - Euclidean Tilings: notebooks/01_Tilings_Euclidean.ipynb
          - Curved Geometries: notebooks/02_Curved_Geometries.ipynb
          - Conway Operators: notebooks/05_Conway_Operators.ipynb
          - Styling: notebooks/07_Styling.ipynb
          - Modifications: notebooks/08_Modifications.ipynb
          - Image to graph: notebooks/Image To Graph.ipynb
          - Saving and exporting: notebooks/Saving_and_Exporting.ipynb
        #   - GomJau-Hogg Notation: TODO
      - Tilings to origami tesselations:
          - Shrink-Rotate: notebooks/Shrink_Rotate_Tesselations.ipynb
          - Intersecting Cylinders: notebooks/Intersecting_Cylinders.ipynb
          - Alternating Flagstones: notebooks/Alternating Flagstones.ipynb
      # - 04 Folding and Overlap: notebooks/04_Folding_and_Overlap.ipynb #TODO: proper notebook walking through my layer-order algorithm: CP -> Overlap graph -> ILP -> layer-order -> top / bottom rendering

  - Architecture: concepts/architecture.md
  - Contributing:
      - Docs Pipeline: contributing/docs-pipeline.md
  - API Reference: reference/
