site_name: Eucare
site_description: Geometric tilings, Conway operators, and origami crease patterns
repo_url: https://github.com/rremme/eucare

theme:
  name: materialx
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.follow

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: true
      include_requirejs: true
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Concepts:
      - Architecture: concepts/architecture.md
  - Notebooks:
      - Overview: notebooks/00_Overview.ipynb
      - Constructing tilings:
          - 01 Euclidean Tilings: notebooks/01_Tilings_Euclidean.ipynb
          - 02 Curved Geometries: notebooks/02_Curved_Geometries.ipynb
          - 05 Conway Operators: notebooks/05_Conway_Operators.ipynb
          - 06 Export and 3D: notebooks/06_Export_and_3D.ipynb
          - 07 Styling: notebooks/07_Styling.ipynb
          - 08 Modifications: notebooks/08_Modifications.ipynb
          - Image To Graph: notebooks/Image To Graph.ipynb
        #   - GomJau-Hogg Notation: TODO
      - Tilings to origami tesselations:
          - Shrink-Rotate: notebooks/03_Crease_Patterns_SRG.ipynb
          - 09 Interactive SRG: notebooks/09_Interactive_SRG.ipynb
          - Intersecting Cylinders: notebooks/10_Intersecting_Cylinders.ipynb
          - Alternating Flagstones: notebooks/Alternating Flagstones.ipynb
      # - 04 Folding and Overlap: notebooks/04_Folding_and_Overlap.ipynb #TODO: proper notebook walking through my layer-order algorithm: CP -> Overlap graph -> ILP -> layer-order -> top / bottom rendering

  - Contributing:
      - Docs Pipeline: contributing/docs-pipeline.md
  - API Reference: reference/
