site_name: Eucare
site_description: Geometric tilings, Conway operators, and origami crease patterns
repo_url: https://github.com/rremme/eucare

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.follow

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false
      include_requirejs: true
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Concepts:
      - Architecture: concepts/architecture.md
  - Notebooks:
      - Tutorials:
          - 00 Overview: notebooks/00_Overview.ipynb
          - 01 Euclidean Tilings: notebooks/01_Tilings_Euclidean.ipynb
          - 02 Curved Geometries: notebooks/02_Curved_Geometries.ipynb
          - 03 Crease Patterns (SRG): notebooks/03_Crease_Patterns_SRG.ipynb
          - 04 Folding and Overlap: notebooks/04_Folding_and_Overlap.ipynb
          - 05 Conway + SRG: notebooks/05_Conway_Plus_SRG.ipynb
          - 06 Export and 3D: notebooks/06_Export_and_3D.ipynb
      - Reference:
          - Tiling Demo: notebooks/Tiling Demo.ipynb
          - GomJau-Hogg Notation: notebooks/GomJau-Hogg Notation.ipynb
          - Hyperbolic and Other Rings: notebooks/Hyperbolic and other Rings.ipynb
          - Origami Crease Patterns: notebooks/Better reciprocal Figures.ipynb
  - Contributing:
      - Docs Pipeline: contributing/docs-pipeline.md
  - API Reference: reference/
